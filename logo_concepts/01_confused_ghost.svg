<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0A1929"/>
  <!-- Floating question mark -->
  <text x="305" y="115" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="#FFEB3B">?</text>
  <!-- Ghost body with wavy bottom -->
  <path d="M 120 140
           Q 120 80 200 80
           Q 280 80 280 140
           L 280 285
           Q 270 310 255 290
           Q 240 310 225 290
           Q 210 310 195 290
           Q 180 310 165 290
           Q 150 310 135 290
           Q 120 310 120 285 Z"
        fill="#FAFAFA" stroke="#CFD8DC" stroke-width="2"/>
  <!-- Left eye (big, surprised) -->
  <circle cx="170" cy="180" r="22" fill="#1A1A1A"/>
  <circle cx="178" cy="172" r="7" fill="#FAFAFA"/>
  <!-- Right eye (smaller, looking sideways) -->
  <circle cx="232" cy="180" r="17" fill="#1A1A1A"/>
  <circle cx="240" cy="174" r="5" fill="#FAFAFA"/>
  <!-- Mouth: surprised O -->
  <ellipse cx="200" cy="240" rx="14" ry="20" fill="#1A1A1A"/>
  <!-- Tiny sweat drop on forehead -->
  <path d="M 140 110 Q 138 120 142 122 Q 146 120 142 110 Z" fill="#4FC3F7"/>
</svg>
