plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def gitVersionName = {
    try {
        def describe = 'git describe --tags --abbrev=0 --match v*'.execute([], rootDir)
        describe.waitFor()
        if (describe.exitValue() == 0) {
            return describe.text.trim().replaceFirst(/^v/, '')
        }
    } catch (ignored) {}
    return '0.0.0-dev'
}()

def gitVersionCode = {
    try {
        def count = 'git tag --list v*'.execute([], rootDir)
        count.waitFor()
        if (count.exitValue() == 0) {
            def tags = count.text.trim()
            return tags.isEmpty() ? 1 : tags.split('\n').length
        }
    } catch (ignored) {}
    return 1
}()

android {
    namespace = 'com.project01'
    compileSdk = 34

    defaultConfig {
        applicationId "com.project01"
        minSdk = 24
        targetSdk = 34
        versionCode gitVersionCode
        versionName gitVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file('local.properties')
            if (propsFile.exists()) {
                props.load(new FileInputStream(propsFile))
            }
            storeFile file(props.getProperty('RELEASE_STORE_FILE', System.getenv('RELEASE_STORE_FILE') ?: 'release-keystore.jks'))
            storePassword props.getProperty('RELEASE_STORE_PASSWORD', System.getenv('RELEASE_STORE_PASSWORD') ?: '')
            keyAlias props.getProperty('RELEASE_KEY_ALIAS', System.getenv('RELEASE_KEY_ALIAS') ?: 'project01')
            keyPassword props.getProperty('RELEASE_KEY_PASSWORD', System.getenv('RELEASE_KEY_PASSWORD') ?: '')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding = true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true

            // Unmocked android.jar methods return defaults instead of throwing. Without this,
            // adding a Log call to production code makes every plain-JVM test that reaches it
            // fail with "Method d in android.util.Log not mocked" — logging would silently
            // dictate which tests must run under Robolectric.
            returnDefaultValues = true

            // Print WHY a test failed in the build log. Without this a CI failure reads only
            // "There were failing tests. See the report at file:///…" — a path on a runner
            // that no longer exists by the time anyone looks.
            all {
                testLogging {
                    events "failed", "skipped"
                    exceptionFormat "full"
                    showExceptions = true
                    showCauses = true
                    showStackTraces = true
                    // Our own Log output for the failing test, which is often the whole story.
                    showStandardStreams = false
                }
                // A one-line tally at the end, so a green run is also legible.
                afterSuite { desc, result ->
                    if (desc.parent == null) {
                        println("Tests: ${result.testCount} — " +
                                "${result.successfulTestCount} passed, " +
                                "${result.failedTestCount} failed, " +
                                "${result.skippedTestCount} skipped")
                    }
                }
            }
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'org.mockito:mockito-core:5.10.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.1.0'
    testImplementation 'app.cash.turbine:turbine:1.0.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    testImplementation 'androidx.test:core-ktx:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
