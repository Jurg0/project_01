android.useAndroidX=true
# Jetifier off: it rewrites old support-library references, and `./gradlew checkJetifier`
# reports this project uses none. Leaving it on made every build rewrite every dependency
# (media3-ui legitimately mentions MediaSessionCompat for legacy interop, which produced a
# "partially migrated library" warning on each run). Re-run checkJetifier before adding any
# dependency that predates AndroidX.
android.enableJetifier=false
org.gradle.jvmargs=-Xmx4g
# Local JDK path. CI strips this line before building (see .github/workflows/ci.yml).
# The version-agnostic Homebrew symlink avoids breaking on brew patch bumps.
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
